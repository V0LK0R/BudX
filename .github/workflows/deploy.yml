name: Deploy BudX IPA to TestFlight

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download IPA from Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0.0 --pattern "BudX.ipa" --clobber

      - name: Upload to TestFlight via App Store API
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: 'BudX.ipa'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
